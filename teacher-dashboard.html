<!DOCTYPE html>
<html>

<head>
    <title>Teacher Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            display: flex;
            background: #f5f7fb;
        }

        .sidebar {
            width: 240px;
            background: #fff;
            height: 100vh;
            padding: 20px;
            border-right: 1px solid #eee;
            position: fixed;
        }


        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 8px;
        }

        .sidebar ul li:hover {
            background: #f0f4ff;
        }

        .active {
            background: #e6edff;
            color: #1f6bff;
            font-weight: bold;
        }

        .main {
            margin-left: 240px;
            width: 100%;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .btn {
            background: #1f6bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .class-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .class-card {
            padding: 20px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .students {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .student-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .student-info {
            display: flex;
            gap: 10px;
        }

        .student-info img {
            width: 50px;
            border-radius: 50%;
        }

        .actions button {
            margin: 5px;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .present {
            background: #d4f8e8;
            color: green;
        }

        .absent {
            background: #ffd6d6;
            color: red;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>Smart Attendance</h2>
        <p>Teacher</p>

        <ul>
            <li class="active">Overview</li>
            <li>Classes</li>
            <li>Start Attendance</li>
            <li>Reports</li>
        </ul>

        <br><br>

        <p id="normaltext"></p>
        <p id="normalemail"></p>

        <button class="logout">Logout</button>
    </div>

    <!-- MAIN -->
    <div class="main">

        <div class="topbar">
            <h1>Dashboard</h1>
        </div>

        <div class="container">

            <h2 id="name"></h2>
            <br>

            <div class="cards">
                <div class="card">
                    <h3>Subject</h3>
                    <p id="subject"></p>
                </div>

                <div class="card">
                    <h3>Total Students</h3>
                    <p id="studentsCount"></p>
                </div>

                <div class="card">
                    <h3>Present Today</h3>
                    <p id="presentCount"></p>
                </div>

                <div class="card">
                    <h3>Absent Today</h3>
                    <p id="absentCount"></p>
                </div>
            </div>

            <h3>Student List</h3><br>

            <div class="students" id="students"></div>


        </div>

    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("loggedTeacher"));

        if (!user) {
            window.location.href = "login_signup/teacher-login.html";
        }

        // user info
        document.getElementById("normaltext").innerText = user.name;
        document.getElementById("normalemail").innerText = user.email;
        document.getElementById("name").innerText = "Welcome back, " + user.name;
        document.getElementById("subject").innerText = user.subject;

        // logout
        document.querySelector(".logout").addEventListener("click", () => {
            localStorage.removeItem("loggedTeacher");
            window.location.href = "login_signup/teacher-login.html";
        });

        const container = document.getElementById("students");

        let present = 0;
        let absent = 0;

        fetch(`http://localhost:3000/students?teacher_id=${user.id}`)
            .then(res => res.json())
            .then(students => {

                container.innerHTML = "";

                document.getElementById("studentsCount").innerText = students.length;

                students.forEach(s => {
                    const div = document.createElement("div");
                    div.className = "student-card";

                    div.innerHTML = `
                        <div class="student-info">
                            
                            <div>
                                <b>${s.name}</b><br>
                                <small>${s.roll_no}</small>
                            </div>
                        </div>

                        <div class="actions">
                            <button class="present" onclick="mark(this,'present')">Present</button>
                            <button class="absent" onclick="mark(this,'absent')">Absent</button>
                        </div>
                    `;

                    container.appendChild(div);
                });
            });

        function mark(btn, type) {
            const parent = btn.parentElement;

            if (type === "present") {
                parent.querySelector(".present").style.background = "green";
                parent.querySelector(".present").style.color = "white";

                parent.querySelector(".absent").style.background = "#ffd6d6";
                parent.querySelector(".absent").style.color = "red";

                present++;
            } else {
                parent.querySelector(".absent").style.background = "red";
                parent.querySelector(".absent").style.color = "white";

                parent.querySelector(".present").style.background = "#d4f8e8";
                parent.querySelector(".present").style.color = "green";

                absent++;
            }

            document.getElementById("presentCount").innerText = present;
            document.getElementById("absentCount").innerText = absent;
        }

    </script>

</body>

</html>
