<!DOCTYPE html>
<html>
<head>
<title>Attendance Report</title>

<style>
body{
  font-family:Arial;
  background:#f5f7fb;
  padding:20px;
}

h2{
  margin-bottom:20px;
}

/* cards */
.cards{
  display:flex;
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  flex:1;
  box-shadow:0 5px 10px rgba(0,0,0,0.05);
}

.green{ color:green; }
.red{ color:red; }

/* graph bars */
.bar-container{
  margin:15px 0;
}

.bar{
  height:20px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  text-align:right;
  padding-right:5px;
  color:white;
  font-size:12px;
  line-height:20px;
}

/* warning */
.warning{
  margin-top:20px;
  padding:15px;
  background:#ffe5e5;
  color:red;
  border-radius:10px;
}
</style>

</head>

<body>

<h2>Attendance Report</h2>

<!-- OVERALL -->
<div class="cards">
  <div class="card">
    <h3>Overall Attendance</h3>
    <p id="overall">--</p>
  </div>

  <div class="card">
    <h3>Monthly Attendance (April)</h3>
    <p id="monthly">--</p>
  </div>
</div>

<!-- SUBJECT GRAPH -->
<div class="card">
  <h3>Subject-wise Attendance</h3>
  <div id="subjects"></div>
</div>

<!-- WARNING -->
<div id="warningBox"></div>

<script>

// student
const student = JSON.parse(localStorage.getItem("student"));

if (!student) {
  window.location.href = "login_signup/student-login.html";
}

const student_id = student.id;

// fetch report
fetch(`http://localhost:3000/attendance/report/${student_id}`)
.then(res => res.json())
.then(data => {

  const overall = data.overall;

  document.getElementById("overall").innerText = overall + "%";
  document.getElementById("monthly").innerText = overall + "%";

  const subjectDiv = document.getElementById("subjects");
  const warningBox = document.getElementById("warningBox");

  let warnings = [];

  for(let sub in data.subjects){

    const percent = data.subjects[sub].percent;

    // create bar
    subjectDiv.innerHTML += `
      <div class="bar-container">
        <p>${sub} (${percent}%)</p>
        <div class="bar">
          <div class="fill ${percent >= 75 ? 'green':'red'}"
               style="width:${percent}%">
            ${percent}%
          </div>
        </div>
      </div>
    `;

    // collect low attendance
    if(percent < 75){
      warnings.push(sub);
    }
  }

  // show warning
  if(warnings.length > 0){
    warningBox.innerHTML = `
      <div class="warning">
        ⚠ Low Attendance in: ${warnings.join(", ")}
      </div>
    `;
  }

});

</script>

</body>
</html>
