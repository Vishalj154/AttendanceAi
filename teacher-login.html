<!DOCTYPE html>
<html>
<head>
<title>Teacher Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f0ff;
}

.container{
    text-align:center;
    padding-top:40px;
}

.back{
    text-decoration:none;
    color:black;
    font-size:14px;
}

.icon{
    width:70px;
    height:70px;
    background:#e0e7ff;
    margin:20px auto;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
}

.card{
    width:350px;
    margin:30px auto;
    padding:25px;
    border:1px solid black;
    border-radius:12px;
    text-align:left;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    border-radius:5px;
    color:white;
    text-decoration:none;
    font-size:14px;
    
}
.admin{
    background:#0d0ada;
}
</style>

</head>

<body>

<div class="container">

<a href="index.html" class="back">← Back to Role Selection</a>

<div class="icon">📘</div>

<h1>Teacher Login</h1>
<p>Enter your credentials to continue</p>

<div class="card">

<label>Email Address</label>
<input type="email" placeholder="teacher@college.edu">

<label>Password</label>
<input type="password" placeholder="******">

<a href="teacher-dashboard.html" class="btn admin">login</a>

</div>

</div>

</body>
</html>
