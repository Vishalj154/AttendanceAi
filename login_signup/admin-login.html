<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #eef3fb;
        }

        .container {
            text-align: center;
            padding-top: 40px;
        }

        .back {
            text-decoration: none;
            color: black;
            font-size: 14px;
        }

        .icon {
            width: 70px;
            height: 70px;
            background: #dbeafe;
            margin: 20px auto;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .card {
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border: 1px solid black;
            border-radius: 12px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-size: 14px;

        }

        .admin {
            background: #0d0ada;
        }
    </style>

</head>

<body>

    <div class="container">

        <a href="login.html" class="back">← Back to Role Selection</a>

        <div class="icon">🛡️</div>

        <h1>Admin Login</h1>
        <p>Enter your credentials to continue</p>

        <div class="card">

            <label>Email Address</label>
            <input type="email" id="email" placeholder="admin@college.edu" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="******" required>
            <button class="btn admin" onclick="login()">Login</button>

        </div>

    </div>
    <script>
        

            function login() {
                let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            // check empty
            if (email === "" || password === "") {
                alert("Please enter email and password");
            return;
            }

            // simple admin check (you can change later)
            if (email === "admin@college.edu" && password === "1234") {
                window.location.href = "../admin-dashboard.html";
            } else {
                alert("Invalid login credentials");
            }
}

    
    </script>

</body>

</html>
