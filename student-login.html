<!DOCTYPE html>
<html>
<head>
<title>Student Login</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#eef7f1;
}

.container{
    text-align:center;
    padding-top:40px;
}

.back{
    text-decoration:none;
    color:black;
    font-size:14px;
}

.icon{
    width:70px;
    height:70px;
    background:#d1fae5;
    margin:20px auto;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
}

.card{
    width:350px;
    margin:30px auto;
    padding:25px;
    border:1px solid black;
    border-radius:12px;
    text-align:left;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#16a34a;
    color:white;
    border:none;
    border-radius:6px;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="container">

<a href="#" class="back">← Back to Role Selection</a>

<div class="icon">👤</div>

<h1>Student Login</h1>
<p>Enter your credentials to continue</p>

<div class="card">

<label>Email Address</label>
<input type="email" placeholder="student@college.edu">

<label>Password</label>
<input type="password" placeholder="******">

<button>Login</button>

</div>

</div>

</body>
</html>
